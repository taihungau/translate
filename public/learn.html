<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Английский">
  <title>Курс английского</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <!-- Same appearance setting as the subtitles app, applied before the first paint. -->
  <script>try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  try { if (localStorage.getItem("learnBackdrop") !== '"none"') document.documentElement.classList.add("has-backdrop"); } catch { document.documentElement.classList.add("has-backdrop"); }</script>
  <style>
    /* Layout: one reading column (max 640px). Course: progress summary, then the three levels with
       their units in order. Unit: goal, grammar note and phrase list. Practice: one card at a time.
       Colours: Apple's system colours (iOS Human Interface Guidelines), light and dark: grouped
       background, white / #1C1C1E cards, label colours, separators, systemBlue, systemGreen,
       systemRed and systemOrange. Text in green, red or orange on light backgrounds uses Apple's
       high-contrast variants (#248A3D, #D70015, #C93400) so it stays readable.
       Buttons follow Apple's button styles: filled systemBlue for a screen's main action, gray fill
       with blue text for the rest, iOS segmented controls for choices; pressed buttons dim.
       With a wallpaper (html.has-backdrop) every panel, control and caption is frosted glass over a
       landscape, as on an iPhone: translucent white in light mode, smoked in dark mode. */
    :root {
      --bg: #f2f2f7;               /* systemGroupedBackground */
      --card: #ffffff;             /* secondarySystemGroupedBackground */
      --inset: #e5e5ea;            /* systemGray5 */
      --line: #c6c6c8;             /* opaqueSeparator */
      --ink: #000000;              /* label */
      --ink-2: rgba(60, 60, 67, 0.6);   /* secondaryLabel */
      --ink-3: rgba(60, 60, 67, 0.3);   /* tertiaryLabel */
      --accent: #007aff;           /* systemBlue */
      --on-accent: #ffffff;
      --accent-soft: rgba(0, 122, 255, 0.12);
      --say: #c93400;              /* systemOrange, high contrast */
      --ok: #248a3d;               /* systemGreen, high contrast */
      --ok-soft: rgba(52, 199, 89, 0.15);
      --miss: #d70015;             /* systemRed, high contrast */
      --miss-soft: rgba(255, 59, 48, 0.12);
      --flame: #ff9500;            /* systemOrange */
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.05);
      --fill: rgba(118, 118, 128, 0.12);     /* tertiarySystemFill: gray buttons, segmented controls, fields */
      --fill-press: rgba(118, 118, 128, 0.2);
      --seg-on: #ffffff;                     /* a segmented control's selected segment */
      --seg-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04);
      --seg-line: rgba(60, 60, 67, 0.16);
      --danger: #ff3b30;                     /* systemRed, filled */
      --almost-soft: rgba(255, 149, 0, 0.14);
      --glass: rgba(255, 255, 255, 0.6);
      --glass-edge: rgba(255, 255, 255, 0.55);
      --glass-shine: rgba(255, 255, 255, 0.8);
      --glass-shadow: 0 8px 28px rgba(0, 0, 0, 0.12), 0 1px 3px rgba(0, 0, 0, 0.06);
      --glass-blur: blur(26px) saturate(180%);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --radius: 14px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000000; --card: #1c1c1e; --inset: #2c2c2e; --line: #38383a;
        --ink: #ffffff; --ink-2: rgba(235, 235, 245, 0.6); --ink-3: rgba(235, 235, 245, 0.3);
        --accent: #0a84ff; --on-accent: #ffffff; --accent-soft: rgba(10, 132, 255, 0.2);
        --say: #ff9f0a; --ok: #30d158; --ok-soft: rgba(48, 209, 88, 0.18); --miss: #ff453a; --miss-soft: rgba(255, 69, 58, 0.2);
        --flame: #ff9f0a; --shadow: none; color-scheme: dark;
        --fill: rgba(118, 118, 128, 0.24); --fill-press: rgba(118, 118, 128, 0.36); --seg-on: #636366;
        --seg-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04); --seg-line: rgba(235, 235, 245, 0.16);
        --danger: #ff453a; --almost-soft: rgba(255, 159, 10, 0.18);
        --glass: rgba(28, 28, 30, 0.72); --glass-edge: rgba(255, 255, 255, 0.13); --glass-shine: rgba(255, 255, 255, 0.14);
        --glass-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      }
    }
    :root[data-theme="dark"] {
      --bg: #000000; --card: #1c1c1e; --inset: #2c2c2e; --line: #38383a;
      --ink: #ffffff; --ink-2: rgba(235, 235, 245, 0.6); --ink-3: rgba(235, 235, 245, 0.3);
      --accent: #0a84ff; --on-accent: #ffffff; --accent-soft: rgba(10, 132, 255, 0.2);
      --say: #ff9f0a; --ok: #30d158; --ok-soft: rgba(48, 209, 88, 0.18); --miss: #ff453a; --miss-soft: rgba(255, 69, 58, 0.2);
      --flame: #ff9f0a; --shadow: none; color-scheme: dark;
      --fill: rgba(118, 118, 128, 0.24); --fill-press: rgba(118, 118, 128, 0.36); --seg-on: #636366;
      --seg-shadow: 0 3px 8px rgba(0, 0, 0, 0.12), 0 3px 1px rgba(0, 0, 0, 0.04); --seg-line: rgba(235, 235, 245, 0.16);
      --danger: #ff453a; --almost-soft: rgba(255, 159, 10, 0.18);
      --glass: rgba(28, 28, 30, 0.72); --glass-edge: rgba(255, 255, 255, 0.13); --glass-shine: rgba(255, 255, 255, 0.14);
      --glass-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html { background: var(--bg); }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(32px + env(safe-area-inset-bottom, 0px));
    }
    svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .fill { fill: currentColor; stroke: none; }
    a { color: var(--accent); }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .page { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .view { display: flex; flex-direction: column; gap: 16px; }

    /* ---------- type ---------- */
    h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
    h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
    .lede { margin: 6px 0 0; color: var(--ink-2); max-width: 52ch; }
    .eyebrow { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: 0.02em; }
    .say { color: var(--say); }
    .num { font-variant-numeric: tabular-nums; }

    /* ---------- navigation ---------- */
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
    .back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; color: var(--accent); text-decoration: none; font-size: 17px; }
    .back:active { opacity: 0.55; }
    .back svg.i { width: 18px; height: 18px; }
    .nav .count { font-size: 14px; color: var(--ink-2); }

    /* ---------- surfaces ---------- */
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card { border: 1px solid var(--line); } }
    :root[data-theme="dark"] .card { border: 1px solid var(--line); }
    .meter { height: 6px; border-radius: 3px; background: var(--inset); overflow: hidden; }
    .meter i { display: block; height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.4s ease, background-color 0.4s ease; }
    .meter.done i { background: var(--ok); }
    .meter.thin { height: 4px; }

    /* ---------- buttons (Apple's filled and gray styles) ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px;
      border: 0; border-radius: 12px; background: var(--fill); color: var(--accent); text-decoration: none;
      font-size: 17px; font-weight: 600; letter-spacing: -0.01em; text-align: center; line-height: 1.25;
      transition: opacity 0.25s ease, background-color 0.25s ease;
    }
    .btn.primary { background: var(--accent); color: var(--on-accent); }
    span.btn { color: var(--ink-2); }
    .btn.small { min-height: 34px; padding: 0 14px; border-radius: 17px; font-size: 15px; }
    .btn.wide { width: 100%; }
    .btn svg.i { width: 18px; height: 18px; stroke-width: 2; }
    .btn:active, .play:active, .track:active { opacity: 0.55; transition: none; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn-row .btn { flex: 1 1 140px; }
    .btn-stack { display: flex; flex-direction: column; gap: 10px; }

    /* Choices (goal, voice, speed, mode): iOS segmented controls. */
    .chips { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--fill); }
    .chip {
      position: relative; flex: 1 0 auto; min-width: 44px; min-height: 28px; padding: 0 12px; border: 0; border-radius: 7px;
      background: transparent; color: var(--ink); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }
    .chip[aria-checked="true"] { background: var(--seg-on); box-shadow: var(--seg-shadow); font-weight: 600; }
    .chip:active:not([aria-checked="true"]) { opacity: 0.55; }
    /* hairlines between segments, hidden beside the selected one */
    .chip + .chip::before { content: ""; position: absolute; left: -0.5px; top: 7px; bottom: 7px; width: 1px; background: var(--seg-line); transition: opacity 0.2s ease; }
    .chip[aria-checked="true"]::before, .chip[aria-checked="true"] + .chip::before { opacity: 0; }

    /* ---------- course ---------- */
    .summary { display: flex; flex-direction: column; gap: 12px; }
    .summary-stat { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .summary-stat b { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    .summary-stat span { color: var(--ink-2); }
    .summary-note { margin: 0; font-size: 14px; color: var(--ink-2); }
    .summary-about { margin: 0; color: var(--ink-2); font-size: 15px; }

    /* Course sections: Каждый день / Грамматика / Работа */
    .tracks { display: grid; grid-template-columns: repeat(3, 1fr); padding: 3px; border-radius: 13px; background: var(--fill); }
    .track {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 66px; padding: 8px 6px;
      border-radius: 10px; color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 600; text-align: center; line-height: 1.2;
      transition: background-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
    }
    .track[aria-current="page"] { background: var(--seg-on); box-shadow: var(--seg-shadow); color: var(--ink); }
    .track-icon { display: grid; place-items: center; color: var(--ink-2); }
    .track-icon svg.i { width: 24px; height: 24px; }
    .track[aria-current="page"] .track-icon { color: var(--accent); }

    /* Today: daily goal ring, streak, and the goal / voice choices */
    .today { display: flex; flex-direction: column; gap: 14px; }
    .today-main { display: flex; align-items: center; gap: 16px; }
    .goal-ring { position: relative; flex: none; width: 76px; height: 76px; }
    .ring { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 7; }
    .ring-track { stroke: var(--inset); }
    .ring-value { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
    .goal-ring.met .ring-value { stroke: var(--ok); }
    .goal-num { position: absolute; inset: 0; display: grid; place-items: center; grid-auto-flow: column; align-content: center; justify-content: center; font-size: 22px; font-weight: 700; }
    .goal-num small { font-size: 13px; color: var(--ink-3); font-weight: 600; align-self: end; padding-bottom: 3px; }
    .goal-ring.met .goal-num { color: var(--ok); }
    .goal-num svg.i { width: 26px; height: 26px; stroke-width: 2.6; }
    .today-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .today-text b { font-size: 17px; }
    .today-text > span { color: var(--ink-2); font-size: 15px; }
    .streak { display: inline-flex; align-items: center; gap: 6px; }
    .streak-icon { display: grid; color: var(--ink-3); }
    .streak-icon svg.i { width: 18px; height: 18px; }
    .streak.lit { color: var(--ink); font-weight: 600; }
    .streak.lit .streak-icon { color: var(--flame); }
    .today-options { display: flex; flex-wrap: wrap; gap: 10px 20px; padding-top: 12px; border-top: 1px solid var(--line); }
    .option { display: flex; align-items: center; gap: 10px; }
    .option-label { font-size: 14px; color: var(--ink-2); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .speed .chip { min-width: 46px; padding: 0 8px; }
    /* Слушать and Сказать side by side, the four speeds as an even row below */
    .tools .btn { flex: 1 1 40%; }
    .tools .speed { display: flex; flex: 1 1 100%; }
    .tools .speed .chip { flex: 1; }
    .level { display: flex; flex-direction: column; gap: 10px; }
    .level-head { display: flex; align-items: center; gap: 10px; }
    .badge {
      display: inline-grid; place-items: center; min-width: 34px; height: 24px; padding: 0 8px; border-radius: 6px;
      background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: 0.02em;
    }
    .level-head h3 { margin: 0; font-size: 18px; font-weight: 650; }
    .level-count { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
    .level-count svg.i { width: 16px; height: 16px; stroke-width: 3; }
    .level.done .level-count { color: var(--ok); }
    .level.done .badge { background: var(--ok-soft); color: var(--ok); }
    .level-about { margin: -4px 0 2px; color: var(--ink-2); font-size: 14px; }
    .units { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .units { border: 1px solid var(--line); } }
    :root[data-theme="dark"] .units { border: 1px solid var(--line); }
    .units li + li { border-top: 1px solid var(--line); }
    .unit { display: flex; align-items: center; gap: 14px; padding: 14px 16px; color: var(--ink); text-decoration: none; min-height: 64px; }
    .unit:active { background: var(--inset); }
    /* Each lesson's icon on a tinted tile: blue to do, green when done, outlined when it's next. */
    .tile {
      flex: none; width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent);
    }
    .tile svg.i { width: 22px; height: 22px; stroke-width: 1.9; }
    .tile.big { width: 56px; height: 56px; border-radius: 15px; }
    .tile.big svg.i { width: 30px; height: 30px; }
    .unit.done .tile { background: var(--ok-soft); color: var(--ok); }
    .unit.next .tile { box-shadow: inset 0 0 0 2px var(--accent); }
    /* Checklist marks: an empty circle, a blue ring filling up, a green circle with a tick when done. */
    .tick { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; }
    .tick svg.arc { width: 28px; height: 28px; transform: rotate(-90deg); }
    .tick circle { fill: none; stroke-width: 2.5; }
    .tick .ring-track { stroke: var(--ink-3); }
    .tick .ring-value { stroke: var(--accent); stroke-width: 3; }
    .tick.done { background: var(--ok); color: #fff; animation: tick-in 0.35s cubic-bezier(.2, 1.4, .4, 1); }
    .tick.done svg.i { width: 16px; height: 16px; stroke-width: 3; }
    @keyframes tick-in { from { transform: scale(0.6); opacity: 0; } }
    .done-word { color: var(--ok); font-weight: 600; }
    /* The lesson's five tasks as icons: cards, listening, reading, speaking, writing */
    .tasks { display: flex; align-items: center; gap: 5px; margin-top: 7px; }
    .task { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--fill); color: var(--ink-3); }
    .task.done { background: var(--ok); color: #fff; }
    .task svg.i { width: 13px; height: 13px; stroke-width: 2.3; }
    .task-sum { margin-left: 3px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
    /* Задания урока: the lesson's checklist */
    .tasks-card { padding-bottom: 6px; }
    .task-count { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
    .tasks-card.done { box-shadow: inset 0 0 0 2px var(--ok), var(--shadow); }
    .tasks-card.done .task-count { color: var(--ok); }
    .task-trophy { display: grid; }
    .task-trophy svg.i { width: 18px; height: 18px; }
    .task-list { list-style: none; margin: 6px 0 0; padding: 0; }
    .task-list li + li { border-top: 1px solid var(--line); }
    .task-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; color: var(--ink); text-decoration: none; }
    .task-row:active { opacity: 0.55; }
    .task-row .unit-text small { font-size: 14px; }
    .task-row.done small { color: var(--ok); }
    .task-row > svg.i { color: var(--ink-3); width: 18px; height: 18px; }
    .task-row b { display: inline-flex; align-items: center; gap: 7px; }
    .task-row b svg.i { width: 17px; height: 17px; color: var(--accent); }
    .task-row.done b svg.i { color: var(--ok); }
    /* every phrase of a lesson gets ticked once she knows it */
    .phrase-list .line-text { flex: 1; }
    .phrase-tick {
      flex: none; width: 22px; height: 22px; margin-top: 8px; border-radius: 50%; display: grid; place-items: center;
      border: 1.5px solid var(--ink-3); color: transparent;
    }
    .phrase-tick svg.i { width: 13px; height: 13px; stroke-width: 3.2; }
    .phrase-tick.on { background: var(--ok); border-color: var(--ok); color: #fff; }
    .unit-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .unit-text b { font-weight: 600; }
    .unit-text small { color: var(--ink-2); font-size: 14px; }
    .unit > svg.i { color: var(--ink-3); width: 18px; height: 18px; }

    /* ---------- unit ---------- */
    .unit-head { display: flex; gap: 14px; align-items: flex-start; }
    .unit-head > div { min-width: 0; }
    .table-wrap { overflow-x: auto; margin-top: 10px; }
    .forms { width: 100%; border-collapse: collapse; }
    .forms th, .forms td { padding: 10px 0; border-top: 1px solid var(--line); vertical-align: top; text-align: left; }
    .forms tr:first-child th, .forms tr:first-child td { border-top: 0; }
    .forms th { width: 34%; padding-right: 12px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
    .forms td { display: flex; flex-direction: column; }
    .forms .en { font-weight: 600; }
    .forms .ru { color: var(--ink-2); font-size: 15px; }
    .mistakes { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; }
    .mistakes li { display: flex; flex-direction: column; gap: 2px; padding: 10px 0; }
    .mistakes li + li { border-top: 1px solid var(--line); }
    .mistakes .wrong { color: var(--miss); text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .mistakes .right { color: var(--ok); font-weight: 600; }
    .mistakes .wrong::before, .mistakes .right::before { display: inline-block; width: 1.3em; font-weight: 700; }
    .mistakes .wrong::before { content: "✕"; }
    .mistakes .right::before { content: "✓"; }
    .mistakes .why { color: var(--ink-2); font-size: 14px; }
    /* Grammar programme */
    .steps { list-style: none; counter-reset: step; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    .steps li { counter-increment: step; display: grid; grid-template-columns: 30px 1fr; column-gap: 12px; align-items: baseline; }
    .steps li::before {
      content: counter(step); grid-row: span 2; align-self: start; width: 30px; height: 30px; border-radius: 8px;
      display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 15px;
    }
    .steps li span { color: var(--ink-2); font-size: 15px; }
    .plan-unit { align-items: flex-start; }
    .plan-unit .unit-text { gap: 2px; }
    .plan-unit .unit-text small { order: -1; }
    .plan-goal { color: var(--ink-2); font-size: 15px; }
    .plan-mistake { font-size: 14px; color: var(--ink-3); }
    .plan-mistake s { color: var(--miss); text-decoration-thickness: 1.5px; }
    .plan-mistake .right { color: var(--ok); font-weight: 600; }
    .plan-unit > .tick { margin-top: 8px; }
    .plan-note { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; }
    .weeks { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 15px; }
    .weeks th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); padding: 8px 8px 8px 0; }
    .weeks td { padding: 10px 8px 10px 0; border-top: 1px solid var(--line); vertical-align: top; }
    .weeks td:first-child { width: 64px; font-weight: 700; color: var(--ink-2); }
    .weeks a { color: var(--ink); text-decoration: none; font-weight: 500; }
    .weeks tr.done td { color: var(--ink-3); }
    .weeks a.done { color: var(--ink-3); text-decoration: line-through; }
    .weeks tr.now td { background: var(--accent-soft); }
    .weeks tr.now td:first-child { border-radius: 8px 0 0 8px; padding-left: 8px; color: var(--accent); }
    .weeks tr.now td:last-child { border-radius: 0 8px 8px 0; }
    .pill { display: block; width: fit-content; margin-top: 4px; padding: 1px 6px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 700; }
    .tips { margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .grammar p { margin: 8px 0 0; }
    .examples { list-style: none; margin: 12px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
    .phrase-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; }
    .phrase-list li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; }
    .phrase-list li + li { border-top: 1px solid var(--line); }
    .examples li { display: flex; gap: 12px; align-items: flex-start; }
    .line-text { min-width: 0; display: flex; flex-direction: column; }
    .line-text .en { font-weight: 600; }
    .line-text .say { font-size: 15px; }
    .line-text .ru { color: var(--ink-2); font-size: 15px; }
    .play {
      flex: none; width: 36px; height: 36px; border: 0; border-radius: 50%; display: grid; place-items: center;
      background: var(--fill); color: var(--accent); transition: opacity 0.25s ease, background-color 0.2s ease;
    }
    .play svg.i { width: 15px; height: 15px; margin-left: 2px; }
    .play.is-playing, .btn.is-playing { color: var(--on-accent); background: var(--accent); }
    .is-playing svg.i { animation: pulse 0.9s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.18); } }

    /* ---------- practice ---------- */
    .modes { display: flex; }
    .modes .chip { flex: 1; min-height: 32px; font-size: 15px; }
    .flash { display: flex; flex-direction: column; gap: 14px; min-height: 280px; padding: 22px 20px; }
    .flash .front, .flash .back { display: flex; flex-direction: column; gap: 8px; }
    .flash .back { padding-top: 14px; border-top: 1px solid var(--line); }
    .flash .en-big { font-size: clamp(24px, 6.4vw, 32px); line-height: 1.25; font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
    .flash .ru-big { font-size: clamp(22px, 5.8vw, 28px); line-height: 1.3; font-weight: 600; text-wrap: balance; }
    .flash .say { font-size: 19px; line-height: 1.35; }
    .flash .ru { font-size: 19px; color: var(--ink-2); }
    .flash .hint { margin: 0; font-size: 14px; color: var(--ink-3); }
    .w { border: 0; padding: 0; background: none; font: inherit; color: inherit; border-radius: 4px; text-decoration: underline dotted var(--ink-3); text-underline-offset: 0.18em; text-decoration-thickness: 1.5px; }
    .w:active { background: var(--accent-soft); }
    .reveal { align-self: flex-start; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
    .tools .btn { flex: 1 1 auto; min-height: 44px; font-size: 16px; padding: 0 14px; border-radius: 10px; }
    .tools .btn.rec { background: var(--danger); color: #fff; }

    .flash-head { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
    .tile.small { width: 30px; height: 30px; border-radius: 8px; }
    .tile.small svg.i { width: 17px; height: 17px; }
    .flash.enter { animation: card-in 0.32s cubic-bezier(.2, .8, .2, 1); }
    @keyframes card-in { from { opacity: 0; transform: translateY(14px) scale(0.985); } }
    .celebrate {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px;
      background: var(--ok-soft); color: var(--ink); animation: card-in 0.4s ease;
    }
    .celebrate-icon { display: grid; color: var(--ok); }
    .celebrate-icon svg.i { width: 26px; height: 26px; }
    .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
    .feedback { border-radius: 12px; padding: 12px 14px; background: var(--inset); display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
    .feedback.good { background: var(--ok-soft); }
    .feedback.bad { background: var(--miss-soft); }
    .feedback .verdict { font-weight: 650; }
    .feedback .marked { font-size: 17px; font-weight: 600; }
    .marked .ok { color: var(--ok); }
    .marked .miss { color: var(--miss); text-decoration: underline wavy; text-underline-offset: 0.2em; }
    .feedback .heard { color: var(--ink-2); }
    .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grade .btn { min-height: 50px; }
    .grade .btn svg.i { width: 18px; height: 18px; stroke-width: 2.2; }
    .tip { margin: 0; font-size: 13px; color: var(--ink-3); text-align: center; }

    .done-card { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 20px; }
    .done-mark { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); }
    .done-mark svg.i { width: 32px; height: 32px; stroke-width: 2.2; }
    .done-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin: 6px 0; }
    .done-stats span { display: flex; flex-direction: column; align-items: center; padding: 10px 4px; border-radius: 10px; background: var(--inset); font-size: 13px; color: var(--ink-2); }
    .done-stats b { font-size: 24px; color: var(--ink); }

    /* ---------- written test ---------- */
    .answer {
      display: block; width: 100%; min-height: 92px; resize: none; padding: 12px 14px; border: 0; border-radius: 12px;
      background: var(--fill); color: var(--ink); font: 19px/1.35 var(--font); letter-spacing: -0.01em;
      transition: box-shadow 0.15s ease;
    }
    .answer::placeholder { color: var(--ink-3); }
    .answer:focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
    .answer.cyrillic { box-shadow: inset 0 0 0 2px var(--flame); }
    .keyboard-hint { margin: -6px 0 0; font-size: 15px; color: var(--say); }
    .check { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 12px; background: var(--inset); animation: card-in 0.3s ease; }
    .check.good { background: var(--ok-soft); }
    .check.almost { background: var(--almost-soft); }
    .check.bad { background: var(--miss-soft); }
    .check .verdict { display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 650; }
    .check.good .verdict { color: var(--ok); }
    .check .verdict svg.i { stroke-width: 2.6; }
    .check-row { display: flex; flex-direction: column; gap: 4px; }
    .check .label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
    .check .btn.small { align-self: flex-start; background: var(--card); }
    .check .play, .own .play { background: var(--card); }
    .answer-line { display: flex; gap: 12px; align-items: flex-start; }
    .answer-line .line-text .en, .marked.right { font-size: 17px; font-weight: 600; }
    .marked.typed { font-size: 17px; }
    .marked.typed .x { color: var(--miss); text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .marked.right .x, .marked.right .near { color: var(--ok); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 0.18em; }
    .marked.typed .near { color: var(--say); text-decoration: underline wavy; text-underline-offset: 0.2em; }
    .fixes { margin: 0; font-size: 15px; color: var(--ink-2); }
    .fixes s { color: var(--miss); }
    .fixes b { color: var(--ok); }
    .best { margin: 0; font-weight: 600; color: var(--accent); }
    .done-mark.soft { background: var(--accent-soft); color: var(--accent); }
    .done-next { margin: 0; text-align: center; color: var(--ink-2); }
    .results { list-style: none; margin: 8px 0 0; padding: 0; }
    .results li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; }
    .results li + li { border-top: 1px solid var(--line); }
    .results .line-text { flex: 1; }
    .results .ru-line { color: var(--ink-2); font-size: 15px; }
    .typed-line { color: var(--miss); text-decoration-thickness: 1.5px; }
    .mark { flex: none; width: 24px; height: 24px; margin-top: 2px; border-radius: 50%; display: grid; place-items: center; background: var(--ok); color: #fff; }
    .mark.no { background: var(--danger); }
    .mark svg.i { width: 14px; height: 14px; stroke-width: 3; }
    .own-card { display: flex; flex-direction: column; gap: 12px; }
    .own-card .plan-note { margin: 0; }
    .own-card > .btn { align-self: flex-start; min-height: 44px; border-radius: 10px; }
    .own { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
    .own:empty { display: none; }
    .own li { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--inset); animation: card-in 0.3s ease; }
    .own li.good { background: var(--ok-soft); }
    .own li.almost { background: var(--almost-soft); }
    .own li.bad { background: var(--miss-soft); }
    .own .verdict { display: flex; align-items: center; gap: 6px; font-weight: 650; }
    .own li.good .verdict { color: var(--ok); }
    .own li.checking .verdict { color: var(--ink-2); animation: breathe 1.2s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: 0.4; } }
    .own .mine { color: var(--ink-2); }
    .own s.mine { color: var(--miss); text-decoration-thickness: 1.5px; }
    .own .why { margin: 0; font-size: 15px; }

    /* ---------- wallpaper and frosted glass ---------- */
    .backdrop { display: none; }
    html.has-backdrop body { background: transparent; }
    .has-backdrop .backdrop {
      display: block; position: fixed; inset: 0; z-index: -1; background: var(--bg) center / cover no-repeat;
      opacity: 0; transition: opacity 0.7s ease;
    }
    .has-backdrop .backdrop.ready { opacity: 1; }
    html.has-backdrop { --radius: 22px; --inset: rgba(118, 118, 128, 0.16); --line: rgba(60, 60, 67, 0.18); }
    @media (prefers-color-scheme: dark) { html.has-backdrop:not([data-theme="light"]) { --inset: rgba(118, 118, 128, 0.3); --line: rgba(255, 255, 255, 0.12); } }
    html.has-backdrop[data-theme="dark"] { --inset: rgba(118, 118, 128, 0.3); --line: rgba(255, 255, 255, 0.12); }
    /* panels, controls and captions */
    .has-backdrop :is(.card, .level, .view > header, .tracks, .modes, .back, .nav .count, .celebrate, .tip, .foot, .done-next, .view > .meter),
    .has-backdrop .view > :is(.btn-stack, .btn-row, .grade) > .btn:not(.primary),
    .has-backdrop .view > .btn:not(.primary) {
      background: var(--glass);
      -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-edge);
      box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-shine);
    }
    .has-backdrop .view > header { padding: 18px; border-radius: var(--radius); }
    .has-backdrop .card { border-radius: var(--radius); }
    /* a level is one glass panel: heading, bar, then its lessons as rows */
    .has-backdrop .level { padding: 16px 16px 0; border-radius: var(--radius); overflow: hidden; }
    .has-backdrop .level .units { margin: 2px -16px 0; background: transparent; box-shadow: none; border: 0; border-top: 1px solid var(--line); border-radius: 0; }
    /* captions become glass capsules */
    .has-backdrop :is(.tip, .foot, .done-next) { width: fit-content; max-width: 100%; margin-inline: auto; padding: 6px 14px; border-radius: 16px; color: var(--ink-2); }
    .has-backdrop .back { padding: 0 14px 0 8px; min-height: 40px; border-radius: 20px; }
    .has-backdrop .nav .count { padding: 7px 12px; border-radius: 16px; color: var(--ink); }
    .has-backdrop .view > .meter { height: 10px; border-radius: 5px; padding: 2px; }
    .has-backdrop .view > .meter i { border-radius: 3px; }
    .has-backdrop :is(.tracks, .modes) { border-radius: 16px; }
    .has-backdrop .modes { padding: 3px; }
    .has-backdrop .modes .chip { border-radius: 12px; min-height: 34px; }
    .has-backdrop .track { border-radius: 13px; }
    .has-backdrop .celebrate { background: linear-gradient(var(--ok-soft), var(--ok-soft)), var(--glass); }
    /* glass buttons: clear with a bright rim; the main one tinted blue with a sheen */
    .has-backdrop .btn { border-radius: 16px; }
    .has-backdrop .btn.primary {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0) 55%), var(--accent);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), inset 0 -1px 0 rgba(0, 0, 0, 0.08), 0 6px 18px rgba(0, 92, 230, 0.32);
    }
    .has-backdrop :is(.tools .btn, .own-card > .btn) { border-radius: 14px; }
    .has-backdrop .tile { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35); }
    /* the wallpaper picker */
    .backdrop-option { flex: 1 1 100%; min-width: 0; flex-direction: column; align-items: stretch; gap: 8px; }
    .swatches { display: flex; gap: 10px; min-width: 0; overflow-x: auto; padding: 4px 4px 2px; margin: 0 -4px; scrollbar-width: none; scroll-snap-type: x proximity; }
    .swatches::-webkit-scrollbar { display: none; }
    .swatch { flex: none; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 0; border: 0; background: none; scroll-snap-align: start; }
    .swatch-img {
      display: block; width: 58px; height: 40px; border-radius: 10px; background: var(--fill) center / cover no-repeat;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08); transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .swatch-img.plain { background: linear-gradient(135deg, transparent 47%, var(--ink-3) 48%, var(--ink-3) 52%, transparent 53%), var(--bg); box-shadow: inset 0 0 0 1px var(--line); }
    .swatch[aria-checked="true"] .swatch-img { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--accent); }
    .swatch:active .swatch-img { transform: scale(0.94); }
    .swatch-label { font-size: 12px; font-weight: 500; color: var(--ink-2); }
    .swatch[aria-checked="true"] .swatch-label { color: var(--accent); font-weight: 600; }
    /* without blur, or with transparency turned down: solid panels */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { html.has-backdrop { --glass: var(--card); } }
    @media (prefers-reduced-transparency: reduce) { html.has-backdrop { --glass: var(--card); } }

    /* ---------- listening, reading, speaking ---------- */
    .choices { display: flex; flex-direction: column; gap: 8px; }
    .choice {
      display: flex; align-items: center; gap: 8px; width: 100%; min-height: 52px; padding: 12px 16px; border: 0; border-radius: 14px;
      background: var(--fill); color: var(--ink); text-align: left; font-size: 17px; font-weight: 500; line-height: 1.3;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .choice:active:not(:disabled) { transform: scale(0.98); opacity: 0.7; }
    .choice:disabled { cursor: default; color: var(--ink-2); }
    .choice.right { background: var(--ok-soft); color: var(--ok); font-weight: 650; box-shadow: inset 0 0 0 2px var(--ok); }
    .choice.wrong { background: var(--miss-soft); color: var(--miss); box-shadow: inset 0 0 0 2px var(--miss); }
    .choice svg.i { width: 18px; height: 18px; stroke-width: 2.6; }
    .listen-row { display: flex; align-items: center; gap: 14px; }
    .big-play {
      flex: none; width: 72px; height: 72px; border: 0; border-radius: 50%; display: grid; place-items: center;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 55%), var(--accent); color: #fff;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 8px 22px rgba(0, 92, 230, 0.32);
    }
    .big-play svg.i { width: 28px; height: 28px; margin-left: 4px; }
    .big-play:active { transform: scale(0.95); }
    .drill-answer { display: flex; gap: 12px; align-items: flex-start; padding-top: 14px; border-top: 1px solid var(--line); animation: card-in 0.3s ease; }
    .drill-answer .line-text { flex: 1; }
    .drill-answer .en { font-size: 18px; }
    .drill .en-big { font-size: clamp(22px, 6vw, 28px); line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; }
    .self-mark { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 12px; font-weight: 600; }
    .self-mark.good { background: var(--ok-soft); color: var(--ok); }
    .self-mark.bad { background: var(--inset); color: var(--ink-2); }

    .foot { margin: 0; font-size: 13px; color: var(--ink-3); text-align: center; text-wrap: balance; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  </style>
</head>
